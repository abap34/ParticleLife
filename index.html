<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ぱてら</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: black;
            overflow: hidden;
        }

        canvas {
            background-color: black;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        .config-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .config-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .config-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 99;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            color: white;
            backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            min-width: 300px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .config-panel.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .config-section {
            margin-bottom: 24px;
        }

        .config-section:last-child {
            margin-bottom: 0;
        }

        .config-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.9);
        }

        .config-item {
            margin-bottom: 16px;
        }

        .config-item:last-child {
            margin-bottom: 0;
        }

        .config-item label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.7);
        }

        .config-item input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .config-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .config-item input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .config-item input[type="number"]:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .config-value {
            display: inline-block;
            float: right;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 1px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.9);
            color: black;
        }

        .btn-primary:hover {
            background: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .config-panel::-webkit-scrollbar {
            width: 6px;
        }

        .config-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .config-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .config-panel::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <!-- Config Toggle Button -->
    <div class="config-toggle" id="configToggle">
        Config
    </div>

    <!-- Config Panel -->
    <div class="config-panel" id="configPanel">
        <div class="config-section">
            <h3>Basic Settings</h3>
            <div class="config-item">
                <label>N Particles <span class="config-value" id="numParticlesValue">3200</span></label>
                <input type="range" id="numParticles" min="500" max="5000" step="100" value="3200">
            </div>
            <div class="config-item">
                <label>N Types <span class="config-value" id="particleTypesValue">5</span></label>
                <input type="range" id="particleTypes" min="2" max="8" step="1" value="5">
            </div>
        </div>

        <div class="config-section">
            <h3>Physics Settings</h3>
            <div class="config-item">
                <label>Force Coefficient <span class="config-value" id="coefValue">0.05</span></label>
                <input type="range" id="coef" min="0.01" max="0.2" step="0.005" value="0.05">
            </div>
            <div class="config-item">
                <label>Gradient Force <span class="config-value" id="gradientStrengthValue">0.02</span></label>
                <input type="range" id="gradientStrength" min="0.0" max="0.1" step="0.005" value="0.02">
            </div>
            <div class="config-item">
                <label>Max Speed <span class="config-value" id="speedUpperBoundValue">1.5</span></label>
                <input type="range" id="speedUpperBound" min="0.5" max="3.0" step="0.1" value="1.5">
            </div>
            <div class="config-item">
                <label>Min Speed <span class="config-value" id="speedLowerBoundValue">0.2</span></label>
                <input type="range" id="speedLowerBound" min="0.05" max="0.5" step="0.05" value="0.2">
            </div>
        </div>

        <div class="config-section">
            <h3>Speed Control</h3>
            <div class="config-item">
                <label>Speed Decay <span class="config-value" id="speedDecayValue">0.95</span></label>
                <input type="range" id="speedDecay" min="0.8" max="0.99" step="0.01" value="0.95">
            </div>
            <div class="config-item">
                <label>Speed Growth <span class="config-value" id="speedGrowthValue">1.05</span></label>
                <input type="range" id="speedGrowth" min="1.01" max="1.2" step="0.01" value="1.05">
            </div>
            <div class="config-item">
                <label>Viscosity <span class="config-value" id="viscosityValue">0.02</span></label>
                <input type="range" id="viscosity" min="0.0" max="0.1" step="0.005" value="0.02">
            </div>
        </div>

        <div class="config-section">
            <h3>Border Settings</h3>
            <div class="config-item">
                <label>Border Bounce</label>
                <div style="display: flex; align-items: center;">
                    <input type="checkbox" id="borderBounce" checked style="width: auto; margin-right: 8px;">
                    <span>Enable boundary reflection</span>
                </div>
            </div>
            <div class="config-item">
                <label>Border Force <span class="config-value" id="borderForceValue">0.5</span></label>
                <input type="range" id="borderForce" min="0.1" max="1.0" step="0.05" value="0.5">
            </div>
            <div class="config-item">
                <label>Border Margin <span class="config-value" id="borderMarginValue">30</span></label>
                <input type="range" id="borderMargin" min="5" max="100" step="5" value="30">
            </div>
        </div>

        <div class="config-section">
            <h3>Display Settings</h3>
            <div class="config-item">
                <label>Canvas Width</label>
                <input type="number" id="canvasWidth" value="1600" min="800" max="3200">
            </div>
            <div class="config-item">
                <label>Canvas Height</label>
                <input type="number" id="canvasHeight" value="800" min="400" max="1600">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="applyBtn">Apply</button>
            <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>
    </div>

    <script src="configUI.js" type="module"></script>
    <script src="main.js" type="module"></script>
</body>

</html>
